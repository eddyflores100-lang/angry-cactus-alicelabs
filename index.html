
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANGRY CACTUS | Not Cute Coloring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: "#FF1E1E",
              background: {
                light: "#FFFFFF",
                dark: "#0A0A0A"
              }
            },
            fontFamily: {
              display: ["Anton", "sans-serif"],
              sans: ["Inter", "sans-serif"]
            }
          }
        }
      }
    </script>
    <style>
      .brutalist-shadow {
        box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
      }
      .dark .brutalist-shadow {
        box-shadow: 8px 8px 0px 0px #FF1E1E;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 12px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #000;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #FF1E1E;
        border: 3px solid #000;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body class="bg-background-light dark:bg-background-dark text-black dark:text-white antialiased custom-scrollbar">
    <div id="root"></div>
</body>
</html>
